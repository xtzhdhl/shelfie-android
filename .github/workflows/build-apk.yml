name: Build and Publish SHELFIE V1.9.5

on:
  push:
    branches:
      - main
    paths:
      - 'shiqi_android_v19_5_bouncy_wordmark.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shelfie-v1-9-5-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Test, build, sign and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify only the current workflow is active
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [[ "${#workflow_files[@]}" -ne 1 || "${workflow_files[0]}" != ".github/workflows/build-apk.yml" ]]; then
            echo "Expected exactly one active workflow: .github/workflows/build-apk.yml"
            printf '%s\n' "${workflow_files[@]:-<none>}"
            exit 1
          fi
          echo "Verified: build-apk.yml is the only active workflow."

      - name: Extract and validate V1.9.5 source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="shiqi_android_v19_5_bouncy_wordmark.zip"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE"
          rm -rf source
          mkdir -p source
          unzip -q "$ARCHIVE" -d source
          test -s source/package.json
          test -s source/android/settings.gradle
          test -s source/android/app/build.gradle
          test -s source/android/app/src/main/assets/www/index.html
          echo "Source archive extracted and required Android files verified."

      - name: Remove inactive workflow copies from packaged source
        shell: bash
        run: |
          set -euo pipefail
          find source -maxdepth 1 -type f \( -name 'build-apk*.yml' -o -name 'build-apk*.yaml' \) -delete
          test -s source/.github/workflows/build-apk.yml
          mapfile -t packaged_workflows < <(find source/.github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [[ "${#packaged_workflows[@]}" -ne 1 || "${packaged_workflows[0]}" != "source/.github/workflows/build-apk.yml" ]]; then
            echo "Packaged source must contain exactly one workflow."
            printf '%s\n' "${packaged_workflows[@]:-<none>}"
            exit 1
          fi
          echo "Inactive root-level workflow copies removed; one packaged workflow remains."

      - name: Read and verify app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" source/android/app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' source/android/app/build.gradle | head -n 1)"
          test "$VERSION_NAME" = "1.9.5"
          test "$VERSION_CODE" = "24"
          echo "SHELFIE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SHELFIE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building SHELFIE $VERSION_NAME (versionCode $VERSION_CODE)."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare and verify offline handwriting font
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-handwriting-font.sh
          test -s www/assets/fonts/shelfie-handwriting.woff2
          test -s www/assets/fonts/OFL-Xiaolai.txt
          test -s android/app/src/main/assets/www/assets/fonts/shelfie-handwriting.woff2
          test -s android/app/src/main/assets/www/assets/fonts/OFL-Xiaolai.txt
          cmp -s www/assets/fonts/shelfie-handwriting.woff2 android/app/src/main/assets/www/assets/fonts/shelfie-handwriting.woff2
          echo "Offline font files and license verified."

      - name: Update stale version-specific assertions in archived workflow test
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_file = Path("tests/android-bridge-contract.test.mjs")
          source = test_file.read_text(encoding="utf-8")
          replacements = [
              (
                  r"assert.match(workflow, /shiqi_android_v19_4_smooth_splash_motion\.zip/);",
                  r"assert.match(workflow, /shiqi_android_v19_\d+_[a-z0-9_]+\.zip/);",
              ),
              (
                  r"assert.match(workflow, /unzip -q shiqi_android_v19_4_smooth_splash_motion\.zip -d source/);",
                  r"assert.match(workflow, /unzip -q shiqi_android_v19_\d+_[a-z0-9_]+\.zip -d source/);",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one outdated assertion, found {count}: {old}"
                  )
              source = source.replace(old, new, 1)
          test_file.write_text(source, encoding="utf-8")
          print("Updated both stale ZIP-name assertions.")
          PY

      - name: Run automated tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Check JavaScript syntax
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            www/app.js \
            www/photo-recognition.js \
            www/product-lookup.js \
            www/ai-mutations.js \
            www/date-utils.js \
            www/backup-utils.js \
            www/ocr-import.js; do
            test -s "$file"
            node --check "$file"
          done
          echo "JavaScript syntax checks passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore and verify persistent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELFIE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$${KEYSTORE_BASE64:-}" || { echo "Missing SHELFIE_KEYSTORE_BASE64"; exit 1; }
          test -n "$${KEYSTORE_PASSWORD:-}" || { echo "Missing SHELFIE_KEYSTORE_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shelfie-upload.jks"
          test -s "$RUNNER_TEMP/shelfie-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/shelfie-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias shelfie-upload >/dev/null
          echo "Persistent signing key restored and alias verified."

      - name: Build signed debug APK
        working-directory: source/android
        shell: bash
        env:
          SHELFIE_KEYSTORE_PATH: ${{ runner.temp }}/shelfie-upload.jks
          SHELFIE_KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
          SHELFIE_KEY_ALIAS: shelfie-upload
          SHELFIE_KEY_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and persistent signature
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/shelfie-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="source/android/app/build/outputs/apk/debug/app-debug.apk"
          SDK_DIR="$${ANDROID_HOME:-$${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_DIR"
          BUILD_TOOLS="$SDK_DIR/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.shelfie.expiry.debug'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='24' versionName='1.9.5'"
          EXPECTED_CERT="$(keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias shelfie-upload 2>/dev/null \
            | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | sed 's/://g' \
            | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          ACTUAL_CERT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/apk-cert.txt" | head -n 1 | sed 's/://g' \
            | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          if [[ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]]; then
            echo "APK signing certificate does not match the persistent keystore."
            exit 1
          fi
          echo "APK package, version, and signing certificate verified."

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp source/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/shelfie-v$${SHELFIE_VERSION_NAME}.apk"
          test -s "dist/shelfie-v$${SHELFIE_VERSION_NAME}.apk"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: shelfie-v${{ env.SHELFIE_VERSION_NAME }}-debug-apk
          path: dist/shelfie-v${{ env.SHELFIE_VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.SHELFIE_VERSION_NAME }}
          name: SHELFIE V${{ env.SHELFIE_VERSION_NAME }}
          body: |
            SHELFIE_VERSION_CODE=${{ env.SHELFIE_VERSION_CODE }}

            V1.9.5 启动页弹跳动画调整：保留已确认正确的「拾期」两个汉字、手写字体与字形，仅调整字标动效。
            「拾」先轻盈蓄力跃起、弹性落地并回弹；「期」稍后跟随，形成错峰、俏皮且自然的双字弹跳节奏。
            标题本身为主动画，标语与英文副标题仅柔和淡入；支持系统减少动态效果设置。
            保留离线内嵌字体、OFL 1.1 许可、应用图标、SQLite、API、头像和用户数据。
            沿用固定签名密钥与原应用包名，支持直接覆盖升级。
          files: dist/shelfie-v${{ env.SHELFIE_VERSION_NAME }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
