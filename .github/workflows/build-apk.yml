name: Build SHELFIE V1.3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SHELFIE V1.3 source
        run: |
          test -f shiqi_android_v13_companion_profiles.zip
          unzip -t shiqi_android_v13_companion_profiles.zip
          rm -rf source
          mkdir -p source
          unzip -q shiqi_android_v13_companion_profiles.zip -d source
          test -f source/package.json
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle
          test -f source/android/app/src/main/assets/www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run automated tests
        working-directory: source
        run: npm test

      - name: Check JavaScript syntax
        working-directory: source
        run: |
          node --check www/app.js
          node --check www/photo-recognition.js
          node --check www/product-lookup.js
          node --check www/ai-mutations.js
          node --check www/date-utils.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: shelfie-v1.3-debug-apk
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
