
name: Build and Publish SHELFIE V1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Extract SHELFIE V1.4 source
        run: |
          set -euo pipefail
          test -f shiqi_android_v14_persistent_updates.zip
          unzip -t shiqi_android_v14_persistent_updates.zip
          rm -rf source
          mkdir -p source
          unzip -q shiqi_android_v14_persistent_updates.zip -d source
          test -f source/package.json
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle
          test -f source/android/app/src/main/assets/www/index.html

      - name: Read app version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" source/android/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' source/android/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "SHELFIE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SHELFIE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building SHELFIE $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Run automated tests
        working-directory: source
        run: npm test

      - name: Check JavaScript syntax
        working-directory: source
        run: |
          set -euo pipefail
          node --check www/app.js
          node --check www/photo-recognition.js
          node --check www/product-lookup.js
          node --check www/ai-mutations.js
          node --check www/date-utils.js
          node --check www/backup-utils.js

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELFIE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Missing repository secret: SHELFIE_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "Missing repository secret: SHELFIE_KEYSTORE_PASSWORD"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shelfie-upload.jks"
          test -s "$RUNNER_TEMP/shelfie-upload.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/shelfie-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias shelfie-upload >/dev/null

          echo "Persistent signing keystore and alias verified."

      - name: Build signed debug APK
        working-directory: source/android
        env:
          SHELFIE_KEYSTORE_PATH: ${{ runner.temp }}/shelfie-upload.jks
          SHELFIE_KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
          SHELFIE_KEY_ALIAS: shelfie-upload
          SHELFIE_KEY_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="source/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          aapt dump badging "$APK" | grep -F "package: name='com.shelfie.expiry.debug'"

      - name: Prepare release APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp source/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/shelfie-v${SHELFIE_VERSION_NAME}.apk"
          test -s "dist/shelfie-v${SHELFIE_VERSION_NAME}.apk"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: shelfie-v${{ env.SHELFIE_VERSION_NAME }}-debug-apk
          path: dist/shelfie-v${{ env.SHELFIE_VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for in-app updates
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.SHELFIE_VERSION_NAME }}
          name: SHELFIE V${{ env.SHELFIE_VERSION_NAME }}
          body: |
            SHELFIE_VERSION_CODE=${{ env.SHELFIE_VERSION_CODE }}

            拾期 Android 个人版：固定签名、完整加密备份与应用内更新。
            物品、API 配置、头像、昵称和主题均可加密备份与恢复。
          files: dist/shelfie-v${{ env.SHELFIE_VERSION_NAME }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
