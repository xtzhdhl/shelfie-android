name: Build and Publish SHELFIE V1.9.2

on:
  push:
    branches:
      - main
    paths:
      - 'shiqi_android_v19_2_splash_glyph_fix.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract SHELFIE V1.9.2 source
        run: |
          set -euo pipefail
          test -f shiqi_android_v19_2_splash_glyph_fix.zip
          unzip -t shiqi_android_v19_2_splash_glyph_fix.zip
          rm -rf source
          mkdir -p source
          unzip -q shiqi_android_v19_2_splash_glyph_fix.zip -d source
          test -f source/package.json
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle
          test -f source/android/app/src/main/assets/www/index.html

      - name: Read and verify app version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" source/android/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' source/android/app/build.gradle | head -n 1)
          test "$VERSION_NAME" = "1.9.2"
          test "$VERSION_CODE" = "21"
          echo "SHELFIE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SHELFIE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building SHELFIE $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Run automated tests
        working-directory: source
        run: npm test

      - name: Check JavaScript syntax
        working-directory: source
        run: |
          set -euo pipefail
          node --check www/app.js
          node --check www/photo-recognition.js
          node --check www/product-lookup.js
          node --check www/ai-mutations.js
          node --check www/date-utils.js
          node --check www/backup-utils.js
          node --check www/ocr-import.js

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELFIE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "Missing SHELFIE_KEYSTORE_BASE64"; exit 1; }
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "Missing SHELFIE_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shelfie-upload.jks"
          test -s "$RUNNER_TEMP/shelfie-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/shelfie-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias shelfie-upload >/dev/null
          echo "Persistent signing key verified."

      - name: Build signed debug APK
        working-directory: source/android
        env:
          SHELFIE_KEYSTORE_PATH: ${{ runner.temp }}/shelfie-upload.jks
          SHELFIE_KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
          SHELFIE_KEY_ALIAS: shelfie-upload
          SHELFIE_KEY_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and package
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/shelfie-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.SHELFIE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="source/android/app/build/outputs/apk/debug/app-debug.apk"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_DIR"
          BUILD_TOOLS="$SDK_DIR/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.shelfie.expiry.debug'"
          EXPECTED_CERT=$(keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias shelfie-upload 2>/dev/null \
            | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | sed 's/://g' \
            | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          ACTUAL_CERT=$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/apk-cert.txt" | head -n 1 | sed 's/://g' \
            | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          if [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "APK signing certificate does not match persistent keystore."
            exit 1
          fi
          echo "APK package and signing certificate verified."

      - name: Prepare release APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp source/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/shelfie-v${SHELFIE_VERSION_NAME}.apk"
          test -s "dist/shelfie-v${SHELFIE_VERSION_NAME}.apk"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: shelfie-v${{ env.SHELFIE_VERSION_NAME }}-debug-apk
          path: dist/shelfie-v${{ env.SHELFIE_VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.SHELFIE_VERSION_NAME }}
          name: SHELFIE V${{ env.SHELFIE_VERSION_NAME }}
          body: |
            SHELFIE_VERSION_CODE=${{ env.SHELFIE_VERSION_CODE }}

            V1.9.2 启动页修正：启动页移除应用图标，只保留「拾期」字标；修正「期」字为真实简体中文楷体字形轮廓。
            Android 12 及以上系统启动画面隐藏默认启动图标，桌面启动器图标仍保留。
            保留 V1.9 的本机离线 OCR 截图表格识别、批量导入和 V1.9.1 品牌图标更新。
            不调用视觉 AI、不上传截图，保留现有 SQLite、API、头像和用户数据。
            沿用固定签名密钥与原应用包名，支持直接覆盖升级。
          files: dist/shelfie-v${{ env.SHELFIE_VERSION_NAME }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
